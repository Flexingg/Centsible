name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: run the contract suite against Actual's newest release so breakage
    # shows up before you upgrade your server.
    - cron: "17 6 * * *"

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Boots the pinned @actual-app/sync-server, seeds a household budget, and checks
      # every endpoint against contract/openapi.yaml.
      - run: npm test
      - run: npm run build

  bridge-newer-actual:
    # Early warning: same suite against Actual's newest release and tonight's nightly
    # build (the next release), so breakage shows up before you upgrade. Allowed to fail.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        actual: [latest, nightly]
    name: bridge vs Actual ${{ matrix.actual }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save @actual-app/api@${{ matrix.actual }} @actual-app/sync-server@${{ matrix.actual }}
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit, fixture-decoding and screenshot tests
        run: ./gradlew test verifyRoborazziDebug
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: android/feature/*/build/outputs/roborazzi

  end-to-end:
    # The app's real data layer against a real bridge and a real Actual server:
    # pairing through the same link a QR code carries, then every feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
        working-directory: bridge
      - name: Start Actual and the bridge (an existing household, and a first run)
        working-directory: bridge
        run: |
          nohup npx tsx test/support/e2e-server.ts 8787 > "$RUNNER_TEMP/e2e.out" 2> "$RUNNER_TEMP/e2e.err" &
          nohup npx tsx test/support/e2e-server.ts 8788 --fresh > "$RUNNER_TEMP/fresh.out" 2> "$RUNNER_TEMP/fresh.err" &
          for i in $(seq 1 60); do grep -q pairingUri "$RUNNER_TEMP/e2e.out" && grep -q setupCode "$RUNNER_TEMP/fresh.out" && break; sleep 2; done
          if ! grep -q pairingUri "$RUNNER_TEMP/e2e.out"; then cat "$RUNNER_TEMP/e2e.err"; exit 1; fi
          if ! grep -q setupCode "$RUNNER_TEMP/fresh.out"; then cat "$RUNNER_TEMP/fresh.err"; exit 1; fi
          echo "E2E_PAIRING_URI=$(tail -n 1 "$RUNNER_TEMP/e2e.out" | jq -r .pairingUri)" >> "$GITHUB_ENV"
          echo "E2E_SETUP_URL=$(tail -n 1 "$RUNNER_TEMP/fresh.out" | jq -r .bridgeUrl)" >> "$GITHUB_ENV"
          echo "E2E_SETUP_CODE=$(tail -n 1 "$RUNNER_TEMP/fresh.out" | jq -r .setupCode)" >> "$GITHUB_ENV"
      - name: Run the app against them
        working-directory: android
        run: ./gradlew :core:engine-bridge:test --tests '*EndToEndTest*'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: end-to-end-report
          path: android/core/engine-bridge/build/reports/tests

  bridge-image:
    # Builds the bridge image, runs the whole first run against the real Actual image with
    # deploy/docker-compose.yml, and only then publishes it (amd64 + arm64) to GHCR.
    needs: bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: bridge
          load: true
          tags: centsible-bridge:ci
      - name: Smoke test with docker compose
        run: BRIDGE_IMAGE=centsible-bridge:ci ./deploy/smoke-test.sh
      - name: Publish?
        id: publish
        if: github.event_name == 'push'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/flexingg/centsible-bridge:${GITHUB_REF_NAME#v},ghcr.io/flexingg/centsible-bridge:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tags=ghcr.io/flexingg/centsible-bridge:0.2.${{ github.run_number }},ghcr.io/flexingg/centsible-bridge:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        if: steps.publish.outputs.tags != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: steps.publish.outputs.tags != ''
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.publish.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Flexingg/Centsible
            org.opencontainers.image.description=Centsible bridge: the Android app's gateway to a self-hosted Actual Budget server
            org.opencontainers.image.licenses=GPL-3.0

  release:
    # Every green push to main becomes a release with the APK attached, so a phone
    # (or an updater like Obtainium) can always grab the newest build. Pushing a
    # tag like v0.3.0 publishes that version number instead.
    needs: [android, end-to-end, bridge-image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A newer push supersedes an older release still in flight.
    concurrency:
      group: release
      cancel-in-progress: true
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Skip if main has moved on
        id: current
        run: |
          # Only the newest commit on main gets a release. Tagging an older commit whose
          # workflow files differ from main's is also refused for the CI token
          # ("Resource not accessible by integration").
          if [[ "$GITHUB_REF" == refs/heads/main ]] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved past this commit; its own run will publish the release."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.current.outputs.stale != 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        if: steps.current.outputs.stale != 'true'
      - name: Version
        if: steps.current.outputs.stale != 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "tag=v0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Signing key
        if: steps.current.outputs.stale != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CENTSIBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CENTSIBLE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::CENTSIBLE_KEYSTORE_BASE64 isn't set, so this APK uses a throwaway debug key and can't update a previous install."
          fi
      - name: Build release APK
        if: steps.current.outputs.stale != 'true'
        env:
          CENTSIBLE_KEYSTORE_PASSWORD: ${{ secrets.CENTSIBLE_KEYSTORE_PASSWORD }}
          CENTSIBLE_KEY_ALIAS: ${{ secrets.CENTSIBLE_KEY_ALIAS }}
          CENTSIBLE_KEY_PASSWORD: ${{ secrets.CENTSIBLE_KEY_PASSWORD }}
        run: |
          # versionCode is the run number, so each build installs over the last one.
          ./gradlew :app:assembleRelease \
            -Pcentsible.versionCode=${{ github.run_number }} \
            -Pcentsible.versionName=${{ steps.version.outputs.name }}
          mv app/build/outputs/apk/release/app-release.apk "centsible-${{ steps.version.outputs.name }}.apk"
          cp ../deploy/.env.example ../deploy/env.example # release assets can't start with a dot
      - uses: softprops/action-gh-release@v3
        if: steps.current.outputs.stale != 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Centsible ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            android/centsible-${{ steps.version.outputs.name }}.apk
            deploy/docker-compose.yml
            deploy/env.example
          body: |
            **Phone:** install `centsible-${{ steps.version.outputs.name }}.apk`.
            **Server:** download `docker-compose.yml` and `env.example` (rename it to `.env`, set `BRIDGE_PUBLIC_URL` and `CLOUDFLARE_TUNNEL_TOKEN`), then `docker compose up -d`. The bridge image is `ghcr.io/flexingg/centsible-bridge:${{ steps.version.outputs.name }}`.
