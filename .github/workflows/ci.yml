name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: run the contract suite against Actual's newest release so breakage
    # shows up before you upgrade your server.
    - cron: "17 6 * * *"

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Boots the pinned @actual-app/sync-server, seeds a household budget, and checks
      # every endpoint against contract/openapi.yaml.
      - run: npm test
      - run: npm run build

  bridge-latest-actual:
    # Early warning: same suite against the newest Actual release. Allowed to fail.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save @actual-app/api@latest @actual-app/sync-server@latest
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, fixture-decoding and screenshot tests
        run: ./gradlew test verifyRoborazziDebug
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/feature/*/build/outputs/roborazzi
