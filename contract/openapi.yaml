      tags: [budgets]
      operationId: rerunRules
      summary: Members. Runs every rule again on these transactions, as if they had just been imported.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [transactionIds], properties: { transactionIds: { type: array, minItems: 1, maxItems: 500, items: { type: string } } } }
      responses:
        '200':
          description: How many changed
          content:
            application/json:
              schema: { type: object, required: [checked, changed], properties: { checked: { type: integer }, changed: { type: integer } } }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    BudgetId:
      name: budgetId
      in: path
      required: true
      description: Actual sync id (the budget's `groupId`), stable across devices
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    MonthParam:
      name: month
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Month' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    BankSyncOverview:
      type: object
      required: [simplefin, schedule, intervals]
      properties:
        simplefin:
          type: object
          required: [configured, requestsToday, dailyQuota]
          properties:
            configured: { type: boolean }
            historyAccess: { type: boolean, description: The bridge holds its own SimpleFIN access (needed to import older history). False for connections made before it existed; reconnect with a new setup token. }
            requestsToday: { type: integer, description: SimpleFIN requests the bridge made in the last 24 hours }
            dailyQuota: { type: integer, description: SimpleFIN Bridge asks for 24 or fewer a day }
        schedule: { $ref: '#/components/schemas/ScheduleState' }
        intervals: { type: array, items: { type: integer } }
        backfill:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BackfillState'
    BackfillState:
      type: object
      description: A history import walking back in 90-day windows. running and waiting carry on by themselves; waiting means paused for SimpleFIN's daily limit or a retry.
      required: [budgetId, accountIds, since, status, reachedDate, windowsDone, windowsTotal, transactionsFound, transactionsAdded, message, startedAt, updatedAt]
      properties:
        budgetId: { type: string }
        accountIds: { type: array, items: { type: string } }
        since: { $ref: '#/components/schemas/Date' }
        status: { type: string, enum: [running, waiting, done, failed, cancelled] }
        reachedDate: { $ref: '#/components/schemas/Date' }
        windowsDone: { type: integer }
        windowsTotal: { type: integer }
        transactionsFound: { type: integer }
        transactionsAdded: { type: integer }
        message: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScheduleState:
      type: object
      required: [intervalHours, lastRunAt, nextRunAt, lastResult]
      properties:
        intervalHours: { type: integer }
        lastRunAt: { type: [string, 'null'], format: date-time }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastResult:
          oneOf:
            - type: 'null'
            - type: object
              required: [newTransactions, accounts, errors, skipped]
              properties:
                newTransactions: { type: integer }
                accounts: { type: integer }
                errors: { type: array, items: { type: string } }
                skipped: { type: [string, 'null'] }
    ExternalAccount:
      type: object
      required: [id, name, institution, balance, currency, linkedAccountId, linkedAccountName]
      properties:
        id: { type: string }
        name: { type: string }
        institution: { type: [string, 'null'] }
        balance: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        linkedAccountId: { type: [string, 'null'] }
        linkedAccountName: { type: [string, 'null'] }
    SyncFieldMapping:
      type: object
      required: [date, payee, notes]
      additionalProperties: false
      properties:
        date: { type: string, enum: [date, postedDate, transactedDate] }
        payee: { type: string, enum: [payeeName, notes] }
        notes: { type: string, enum: [notes, payeeName] }
    SyncMappings:
      type: object
      required: [payment, deposit]
      additionalProperties: false
      properties:
        payment: { $ref: '#/components/schemas/SyncFieldMapping' }
        deposit: { $ref: '#/components/schemas/SyncFieldMapping' }
    BankSyncSettings:
      type: object
      required: [importTransactions, importPending, importNotes, reimportDeleted, updateDates, mapping]
      properties:
        importTransactions: { type: boolean, description: Import transactions at all (off = balances only) }
        importPending: { type: boolean }
        importNotes: { type: boolean }
        reimportDeleted: { type: boolean, description: Bring back bank transactions you deleted }
        updateDates: { type: boolean, description: Update dates of already-imported transactions }
        mapping: { $ref: '#/components/schemas/SyncMappings' }
    SyncSummary:
      type: object
      required: [accounts, newTransactions, results, simplefinRequests]
      properties:
        accounts: { type: integer }
        newTransactions: { type: integer }
        simplefinRequests: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [accountId, name, newTransactions, matchedTransactions, error, status]
            properties:
              accountId: { type: string }
              name: { type: string }
              newTransactions: { type: integer }
              matchedTransactions: { type: integer }
              error: { type: [string, 'null'] }
              status: { type: [string, 'null'] }
    SetupStatus:
      type: object
      required: [needsOwner]
      additionalProperties: false
      properties:
        needsOwner: { type: boolean }
        actual:
          type: string
          enum: [ready, needs-password, needs-login, unsupported, unreachable]
          description: >
            Only while needsOwner. ready: the bridge is signed in to Actual. needs-password: a new
            Actual server, the owner picks its password. needs-login: Actual has a password the
            bridge doesn't know. unsupported: Actual uses OpenID (set ACTUAL_SESSION_TOKEN).
            unreachable: nothing answers at ACTUAL_SERVER_URL.
    SetupClaim:
      type: object
      required: [setupCode, displayName, deviceName, platform]
      additionalProperties: false
      properties:
        setupCode: { type: string, minLength: 4, maxLength: 64, description: From the bridge logs or BRIDGE_SETUP_CODE }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        deviceName: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [android, ios, web, other] }
        actualPassword: { type: string, maxLength: 256, description: Required when actual is needs-password or needs-login }
    Money:
      type: integer
      format: int64
      description: Minor units (cents)
    Month:
      type: string
      pattern: '^\d{4}-\d{2}$'
    Date:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Role:
      type: string
      enum: [owner, member, viewer]

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code, e.g. `unauthorized`, `forbidden`, `not_found`, `validation`, `feature_unavailable`, `actual_unavailable`, `budget_encrypted`, `bank_sync_failed`, `update_failed`, `conflict`, `rate_limited`
        detail: { type: string }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Capabilities:
      type: object
      required: [contract, bridge, actual, status, features]
      properties:
        contract: { type: string, description: Contract version implemented by the bridge }
        bridge:
          type: object
          required: [version]
          properties:
            version: { type: string }
        actual:
          type: object
          required: [apiVersion, compatibility]
          properties:
            serverVersion: { type: [string, 'null'] }
            apiVersion: { type: string }
            compatibility:
              type: string
              enum: [ok, api_newer, api_older, unknown]
        status:
          type: string
          enum: [ok, degraded, unavailable]
        features:
          type: object
          description: Feature flag map. Absent means false.
          additionalProperties: { type: boolean }

    PairRequest:
      type: object
      required: [code, deviceName, platform]
      properties:
        code: { type: string, minLength: 6 }
        deviceName: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [android, ios, web, other] }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, member, device]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        member: { $ref: '#/components/schemas/Member' }
        device: { $ref: '#/components/schemas/Device' }

    Member:
      type: object
      required: [id, displayName, role, disabled, budgetIds]
      properties:
        id: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        budgetIds:
          type: array
          description: Budgets this member may open. Owners implicitly have all.
          items: { type: string }

    NewMember:
      type: object
      required: [displayName, role]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        role: { $ref: '#/components/schemas/Role' }
        budgetIds:
          type: array
          items: { type: string }

    Device:
      type: object
      required: [id, name, platform, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }

    Me:
      type: object
      required: [member, device, devices]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        device: { $ref: '#/components/schemas/Device' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }

    PairingCode:
      type: object
      required: [code, expiresAt, pairingUri]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        pairingUri:
          type: string
          description: |
            `actualbridge://pair?u=<bridge url>&c=<code>[&cfid=<CF Access client id>&cfsecret=<secret>]`
            Encode as a QR code.

    Budget:
      type: object
      required: [id, name, encrypted]
      properties:
        id: { type: string, description: Actual sync id (groupId) }
        name: { type: string }
        encrypted: { type: boolean }

    Account:
      type: object
      required: [id, name, offBudget, closed, balance]
      properties:
        id: { type: string }
        name: { type: string }
        offBudget: { type: boolean }
        closed: { type: boolean }
        balance: { $ref: '#/components/schemas/Money' }
        accountGroupId: { type: [string, 'null'] }
        syncSource: { type: [string, 'null'], description: "Bank sync provider once linked in Actual (goCardless, simpleFin, pluggyai)" }
        lastSync: { type: [string, 'null'], format: date-time }
        bankSyncStatus:
          type: [string, 'null']
          description: Actual's result of the last bank sync for this account (ok, reauth-required, attention-required, rate-limit-exceeded, timed-out, account-missing, failed)

    Category:
      type: object
      required: [id, name, groupId, isIncome, hidden]
      properties:
        id: { type: string }
        name: { type: string }
        groupId: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }

    CategoryGroup:
      type: object
      required: [id, name, isIncome, hidden, categories]
      properties:
        id: { type: string }
        name: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    Payee:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        transferAccountId:
          type: [string, 'null']
          description: Set when this payee represents a transfer to that account

    Transaction:
      type: object
      required: [id, accountId, date, amount, cleared, reconciled, isParent, subtransactions]
      properties:
        id: { type: string }
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: [string, 'null'] }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cleared: { type: boolean }
        reconciled: { type: boolean }
        transferId: { type: [string, 'null'] }
        isParent: { type: boolean }
        parentId: { type: [string, 'null'] }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }

    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { type: [string, 'null'] }
        runningBalances:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/Money' }
          description: The account's balance after each item, in order. Only when listing one account with no other filters.

    AutomationSource:
      type: string
      enum: [ui, notes, none]
      description: "ui: saved as automations; notes: read from #template lines; none: nothing yet"

    AutomationLimit:
      type: object
      required: [amount, hold, period, start]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        hold: { type: boolean, description: Keep anything above the cap instead of taking it back }
        period: { type: string, enum: [daily, weekly, monthly] }
        start: { type: [string, 'null'], description: Weekly caps count weeks from this date }

    AutomationAdjustment:
      type: [object, 'null']
      required: [kind, value]
      properties:
        kind: { type: string, enum: [percent, fixed] }
        value: { type: number, description: "Percent (e.g. 20 or -10), or minor units for fixed" }

    Automation:
      type: object
      required: [type]
      description: |
        One automation. Money in minor units. By type:
        simple (fixed monthly amount and/or a cap): priority, monthly, limit;
        periodic (an amount every N days/weeks/months/years): priority, amount, every {unit, count}, starting, limit;
        by (save by a month, optionally repeating or spending from a month): priority, amount, month, repeat {unit, count}, spendFrom;
        schedule (cover a schedule): priority, schedule (its name), full, adjustment;
        average (of the last N months' spending): priority, months, adjustment;
        copy (what was budgeted N months ago): priority, monthsAgo;
        percentage (of income): priority, percent, of ("all income", "available funds" or an income category id), previous;
        refill (top up to a cap): priority, limit;
        remainder (share of whatever is left): weight, limit;
        goal (long-term balance goal): amount;
        error (a #template line Actual couldn't read; read-only): line, error.
      properties:
        type: { type: string, enum: [simple, periodic, by, schedule, average, copy, percentage, refill, remainder, goal, error] }
        priority: { type: integer, minimum: 0, maximum: 99, description: Lower runs first; 0 can take To Budget below zero }
        description: { type: [string, 'null'] }
        monthly: { type: ['integer', 'null'] }
        amount: { type: integer }
        limit: { oneOf: [{ $ref: '#/components/schemas/AutomationLimit' }, { type: 'null' }] }
        every: { type: object, properties: { unit: { type: string, enum: [day, week, month, year] }, count: { type: integer } } }
        starting: { type: string }
        month: { type: string }
        repeat: { type: [object, 'null'], properties: { unit: { type: string, enum: [month, year] }, count: { type: integer } } }
        spendFrom: { type: [string, 'null'] }
        schedule: { type: string }
        full: { type: boolean }
        adjustment: { $ref: '#/components/schemas/AutomationAdjustment' }
        months: { type: integer }
        monthsAgo: { type: integer }
        percent: { type: number }
        of: { type: string }
        previous: { type: boolean }
        weight: { type: number }
        line: { type: string }
        error: { type: string }

    CategoryAutomations:
      type: object
      required: [categoryId, source, automations, notesHaveTemplates, month, projected, perAutomation]
      properties:
        categoryId: { type: string }
        source: { $ref: '#/components/schemas/AutomationSource' }
        automations: { type: array, items: { $ref: '#/components/schemas/Automation' } }
        notesHaveTemplates: { type: boolean, description: "The notes still have #template or #goal lines (so switching back to notes would use them)" }
        month: { type: [string, 'null'] }
        projected: { type: ['integer', 'null'] }
        perAutomation: { type: [array, 'null'], items: { $ref: '#/components/schemas/Money' } }

    RulePreview:
      type: object
      required: [matchCount, items, errors]
      properties:
        matchCount: { type: integer, description: Every existing transaction the conditions match }
        errors: { type: array, items: { type: string }, description: Conditions Actual couldn't turn into a search }
        items:
          type: array
          items:
            type: object
            required: [transaction, changes]
            properties:
              transaction: { $ref: '#/components/schemas/Transaction' }
              changes:
                type: array
                items:
                  type: object
                  required: [field, value]
                  properties:
                    field: { type: string }
                    value: { description: "The new value (ids shown as names; amounts in minor units)" }
                    note: { type: string }
                    error: { type: string }

    ReviewInbox:
      type: object
      required: [items, total, more, since]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        total: { type: integer, description: How many need review (up to 500) }
        more: { type: boolean, description: More than 500 }
        since: { type: string, format: date-time, description: When this person last caught up }

    NewTransaction:
      type: object
      required: [id, accountId, date, amount]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated. Makes the create idempotent for outbox replays.
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: string }
        payeeName: { type: string, description: Used when payeeId is absent; creates the payee if needed }
        categoryId: { type: string }
        notes: { type: string }
        cleared: { type: boolean }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/SplitInput' }

    SplitInput:
      type: object
      required: [amount]
      properties:
        id: { type: string, description: An existing split's id (PATCH only) }
        amount: { $ref: '#/components/schemas/Money' }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }

    TransactionPatch:
      type: object
      minProperties: 1
      properties:
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: string, description: Used when payeeId is absent; creates the payee if needed }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cleared: { type: boolean }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/SplitInput' }

    Preferences:
      type: object
      required: [budgetType, currencyCode, numberFormat, dateFormat, firstDayOfWeek, hideFraction]
      properties:
        budgetType: { type: string, enum: [envelope, tracking, unknown] }
        currencyCode: { type: string, description: ISO 4217, default USD }
        numberFormat: { type: string, description: "Actual's number format id, e.g. comma-dot" }
        dateFormat: { type: string }
        firstDayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        hideFraction: { type: boolean }

    Autopilot:
      type: object
      required: [month, toBudget, suggestions, overspent, cover]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        toBudget: { $ref: '#/components/schemas/Money' }
        suggestions:
          type: array
          items:
            type: object
            required: [categoryId, name, groupName, budgeted, balance, lastMonthSpent, average, suggested, monthsOfHistory]
            properties:
              categoryId: { type: string }
              name: { type: string }
              groupName: { type: string }
              budgeted: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
              lastMonthSpent: { $ref: '#/components/schemas/Money' }
              average: { $ref: '#/components/schemas/Averages' }
              suggested: { $ref: '#/components/schemas/Averages' }
              monthsOfHistory: { type: integer }
        overspent:
          type: array
          items:
            type: object
            required: [categoryId, name, amount]
            properties:
              categoryId: { type: string }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        cover:
          type: object
          required: [moves, uncovered]
          properties:
            moves: { type: array, items: { $ref: '#/components/schemas/CoverMove' } }
            uncovered: { $ref: '#/components/schemas/Money' }
    Averages:
      type: object
      description: Spending per month (positive = spent), averaged over the last 3, 6 and 12 months with activity. Suggestions are rounded up to whole units.
      required: [avg3, avg6, avg12]
      properties:
        avg3: { $ref: '#/components/schemas/Money' }
        avg6: { $ref: '#/components/schemas/Money' }
        avg12: { $ref: '#/components/schemas/Money' }
    CoverMove:
      type: object
      required: [from, fromName, to, toName, amount]
      properties:
        from: { type: string, description: A category id or "to-budget" }
        fromName: { type: string }
        to: { type: string }
        toName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    Goal:
      type: object
      required: [categoryId, name, groupName, kind, target, targetMonth, balance, budgetedThisMonth, progress, remaining, monthlyNeeded, avgContribution, projectedMonth, status, line]
      properties:
        categoryId: { type: string }
        name: { type: string }
        groupName: { type: string }
        kind: { type: string, enum: [balance, by] }
        target: { $ref: '#/components/schemas/Money' }
        targetMonth: { type: [string, 'null'] }
        balance: { $ref: '#/components/schemas/Money' }
        budgetedThisMonth: { $ref: '#/components/schemas/Money' }
        progress: { type: number, minimum: 0, maximum: 1 }
        remaining: { $ref: '#/components/schemas/Money' }
        monthlyNeeded: { type: [integer, 'null'], description: For "by" goals, what to budget each month from now to make it }
        avgContribution: { type: integer, description: Average budgeted per month lately }
        projectedMonth: { type: [string, 'null'], description: When the balance reaches the target at the recent pace }
        status: { type: string, enum: [reached, on-track, behind, stalled] }
        line: { type: string, description: The note line it came from }
    Forecast:
      type: object
      required: [from, to, accountIds, startingBalance, typicalDaily, events, paid, days, lowest]
      properties:
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }
        accountIds: { type: array, items: { type: string } }
        startingBalance: { $ref: '#/components/schemas/Money' }
        typicalDaily: { type: integer, description: Average daily money in or out that isn't scheduled (last 90 days) }
        events:
          type: array
          items:
            type: object
            required: [date, scheduleId, name, payeeName, accountId, accountName, amount, internalTransfer, overdue]
            properties:
              date: { $ref: '#/components/schemas/Date' }
              scheduleId: { type: string }
              name: { type: string }
              payeeName: { type: [string, 'null'] }
              accountId: { type: [string, 'null'] }
              accountName: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              internalTransfer: { type: boolean, description: Between two forecast accounts, so the total doesn't change }
              overdue: { type: boolean }
        paid:
          type: array
          description: Scheduled bills already paid this month, before today (transactions linked to a schedule). The bill calendar ticks these off.
          items:
            type: object
            required: [date, scheduleId, name, amount]
            properties:
              date: { $ref: '#/components/schemas/Date' }
              scheduleId: { type: string }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
        days:
          type: array
          items:
            type: object
            required: [date, balance, scheduled, typical]
            properties:
              date: { $ref: '#/components/schemas/Date' }
              balance: { $ref: '#/components/schemas/Money' }
              scheduled: { $ref: '#/components/schemas/Money' }
              typical: { $ref: '#/components/schemas/Money' }
        lowest:
          type: object
          required: [date, balance]
          properties:
            date: { $ref: '#/components/schemas/Date' }
            balance: { $ref: '#/components/schemas/Money' }
    Insights:
      type: object
      required: [month, daysElapsed, daysInMonth, spent, typical, projected, categories, alerts]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        daysElapsed: { type: integer }
        daysInMonth: { type: integer }
        spent: { $ref: '#/components/schemas/Money' }
        typical: { $ref: '#/components/schemas/Money' }
        projected: { $ref: '#/components/schemas/Money' }
        categories:
          type: array
          items:
            type: object
            required: [categoryId, name, spent, typical, projected, changePct]
            properties:
              categoryId: { type: [string, 'null'] }
              name: { type: string }
              spent: { $ref: '#/components/schemas/Money' }
              typical: { $ref: '#/components/schemas/Money', description: Average of the three months before }
              projected: { $ref: '#/components/schemas/Money' }
              changePct: { type: [integer, 'null'] }
        alerts: { type: array, items: { $ref: '#/components/schemas/Insight' } }
    Insight:
      type: object
      required: [id, kind, severity, title, detail, amount, date, categoryId, transactionId, scheduleId]
      properties:
        id: { type: string, description: Stable, for "already notified" tracking }
        kind: { type: string, enum: [category-pace, unusual-transaction, new-merchant, price-change] }
        severity: { type: string, enum: [good, info, warning] }
        title: { type: string }
        detail: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { $ref: '#/components/schemas/Date' }
        categoryId: { type: [string, 'null'] }
        transactionId: { type: [string, 'null'] }
        scheduleId: { type: [string, 'null'] }
    Subscriptions:
      type: object
      required: [candidates, priceChanges]
      properties:
        candidates:
          type: array
          items:
            type: object
            required: [payeeId, payeeName, accountId, accountName, amount, approximateAmount, recurrence, lastDate, yearlyAmount, income]
            properties:
              payeeId: { type: string }
              payeeName: { type: string }
              accountId: { type: string }
              accountName: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
              approximateAmount: { type: boolean }
              recurrence: { $ref: '#/components/schemas/Recurrence' }
              lastDate: { type: [string, 'null'] }
              yearlyAmount: { $ref: '#/components/schemas/Money' }
              income: { type: boolean }
        priceChanges:
          type: array
          items:
            type: object
            required: [scheduleId, name, previous, latest, changePct, date]
            properties:
              scheduleId: { type: string }
              name: { type: string }
              previous: { $ref: '#/components/schemas/Money' }
              latest: { $ref: '#/components/schemas/Money' }
              changePct: { type: integer }
              date: { $ref: '#/components/schemas/Date' }
    YearInReview:
      type: object
      description: A period's review (named for the year view, which came first).
      required: [period, start, end, label, previousStart, nextStart, buckets, biggestBucket, smallestBucket, previousPeriod, year, complete, availableYears, empty, income, spending, saved, savingsRate, purchases, dailyAverage, topCategories, topMerchants, mostVisited, biggestPurchase, months, biggestMonth, smallestMonth, noSpendDays, longestNoSpendStreak, newMerchants, merchantsVisited, previousYear]
      properties:
        period: { type: string, enum: [week, month, quarter, year] }
        start: { $ref: '#/components/schemas/Date' }
        end: { $ref: '#/components/schemas/Date' }
        label: { type: string, description: 'e.g. "Week of Sep 21, 2026", "September 2026", "Q3 2026", "2026"' }
        previousStart: { $ref: '#/components/schemas/Date' }
        nextStart: { type: [string, 'null'], description: Null while the next period hasn't started }
        buckets:
          type: array
          description: Days for a week or month, weeks for a quarter, months for a year
          items: { $ref: '#/components/schemas/ReviewBucket' }
        biggestBucket:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReviewBucket'
        smallestBucket:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ReviewBucket'
        previousPeriod:
          oneOf:
            - type: 'null'
            - type: object
              required: [spending, income, spendingChangePct, label]
              properties:
                spending: { $ref: '#/components/schemas/Money' }
                income: { $ref: '#/components/schemas/Money' }
                spendingChangePct: { type: [integer, 'null'] }
                label: { type: string }
        year: { type: integer }
        complete: { type: boolean, description: False while the period is still going }
        availableYears: { type: array, items: { type: integer } }
        empty: { type: boolean }
        income: { $ref: '#/components/schemas/Money' }
        spending: { $ref: '#/components/schemas/Money' }
        saved: { $ref: '#/components/schemas/Money' }
        savingsRate: { type: [integer, 'null'] }
        purchases: { type: integer }
        dailyAverage: { $ref: '#/components/schemas/Money' }
        topCategories:
          type: array
          items:
            type: object
            required: [categoryId, name, amount, share]
            properties:
              categoryId: { type: [string, 'null'] }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              share: { type: number }
        topMerchants: { type: array, items: { $ref: '#/components/schemas/MerchantTotal' } }
        mostVisited:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MerchantTotal'
        biggestPurchase:
          oneOf:
            - type: 'null'
            - type: object
              required: [transactionId, date, payeeName, categoryName, amount]
              properties:
                transactionId: { type: string }
                date: { $ref: '#/components/schemas/Date' }
                payeeName: { type: [string, 'null'] }
                categoryName: { type: [string, 'null'] }
                amount: { $ref: '#/components/schemas/Money' }
        months: { type: array, items: { $ref: '#/components/schemas/MonthTotals' } }
        biggestMonth:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MonthTotals'
        smallestMonth:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MonthTotals'
        noSpendDays: { type: integer }
        longestNoSpendStreak:
          type: object
          required: [days, start, end]
          properties:
            days: { type: integer }
            start: { type: [string, 'null'] }
            end: { type: [string, 'null'] }
        newMerchants: { type: integer }
        merchantsVisited: { type: integer }
        previousYear:
          oneOf:
            - type: 'null'
            - type: object
              required: [spending, income, spendingChangePct]
              properties:
                spending: { $ref: '#/components/schemas/Money' }
                income: { $ref: '#/components/schemas/Money' }
                spendingChangePct: { type: [integer, 'null'] }
    ReviewBucket:
      type: object
      required: [key, label, start, spending, income]
      properties:
        key: { type: string }
        label: { type: string }
        start: { $ref: '#/components/schemas/Date' }
        spending: { $ref: '#/components/schemas/Money' }
        income: { $ref: '#/components/schemas/Money' }
    MerchantTotal:
      type: object
      required: [payeeId, name, amount, visits]
      properties:
        payeeId: { type: string }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        visits: { type: integer }
    MonthTotals:
      type: object
      required: [month, spending, income]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        spending: { $ref: '#/components/schemas/Money' }
        income: { $ref: '#/components/schemas/Money' }
    ServerStatus:
      type: object
      required: [bridge, actual, app, updater, disk, checkedAt]
      properties:
        bridge:
          type: object
          required: [version, latest, updateAvailable, uptimeSeconds]
          properties:
            version: { type: string }
            latest: { type: [string, 'null'] }
            updateAvailable: { type: boolean }
            uptimeSeconds: { type: integer }
        actual:
          type: object
          required: [version, pairedVersion, compatibility, newestRelease, connected]
          properties:
            version: { type: [string, 'null'] }
            pairedVersion: { type: string, description: The Actual release this bridge is built for (and that updates bring) }
            compatibility: { type: string, enum: [ok, api_newer, api_older, unknown] }
            newestRelease: { type: [string, 'null'], description: Actual's newest release; the bridge moves to it after testing }
            connected: { type: boolean }
        app:
          oneOf:
            - type: 'null'
            - type: object
              required: [version, versionCode, publishedAt, url, apkUrl, notes]
              properties:
                version: { type: string }
                versionCode: { type: [integer, 'null'] }
                publishedAt: { type: [string, 'null'] }
                url: { type: string }
                apkUrl: { type: [string, 'null'] }
                notes: { type: [string, 'null'] }
        updater:
          type: object
          required: [configured, lastRequestedAt, lastUpdatedFrom, lastResult]
          properties:
            configured: { type: boolean }
            lastRequestedAt: { type: [string, 'null'] }
            lastUpdatedFrom: { type: [string, 'null'] }
            lastResult: { type: [string, 'null'] }
        disk:
          oneOf:
            - type: 'null'
            - type: object
              required: [free, total]
              properties:
                free: { type: integer }
                total: { type: integer }
        checkedAt: { type: [string, 'null'] }
    BackupOverview:
      type: object
      required: [intervalHours, keep, intervals, lastRunAt, lastError, nextRunAt, totalSize, items]
      properties:
        intervalHours: { type: integer }
        keep: { type: integer }
        intervals: { type: array, items: { type: integer } }
        lastRunAt: { type: [string, 'null'] }
        lastError: { type: [string, 'null'] }
        nextRunAt: { type: [string, 'null'] }
        totalSize: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Backup' } }
    Backup:
      type: object
      required: [id, createdAt, trigger, size, budgets, skipped, household]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        trigger: { type: string, enum: [scheduled, manual] }
        size: { type: integer }
        budgets:
          type: array
          items:
            type: object
            required: [budgetId, name, file, size]
            properties:
              budgetId: { type: string }
              name: { type: string }
              file: { type: string }
              size: { type: integer }
        skipped:
          type: array
          items:
            type: object
            required: [budgetId, name, reason]
            properties:
              budgetId: { type: string }
              name: { type: string }
              reason: { type: string }
        household: { type: boolean }
    BudgetMonth:
      type: object
      required: [month, budgetType, toBudget, incomeAvailable, lastMonthOverspent, forNextMonth,
                 fromLastMonth, totalBudgeted, totalIncome, totalSpent, totalBalance, groups]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        budgetType:
          type: string
          enum: [envelope, tracking, unknown]
        toBudget: { $ref: '#/components/schemas/Money' }
        incomeAvailable: { $ref: '#/components/schemas/Money' }
        lastMonthOverspent: { $ref: '#/components/schemas/Money' }
        forNextMonth: { $ref: '#/components/schemas/Money' }
        fromLastMonth: { $ref: '#/components/schemas/Money' }
        totalBudgeted: { $ref: '#/components/schemas/Money' }
        totalIncome: { $ref: '#/components/schemas/Money' }
        totalSpent: { $ref: '#/components/schemas/Money' }
        totalBalance: { $ref: '#/components/schemas/Money' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/BudgetGroup' }

    BudgetGroup:
      type: object
      required: [id, name, isIncome, hidden, budgeted, spent, balance, received, categories]
      properties:
        id: { type: string }
        name: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }
        budgeted: { $ref: '#/components/schemas/Money' }
        spent: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        received: { $ref: '#/components/schemas/Money' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/BudgetCategory' }

    BudgetCategory:
      type: object
      required: [id, name, hidden, budgeted, spent, balance, received, carryover]
      properties:
        id: { type: string }
        name: { type: string }
        hidden: { type: boolean }
        budgeted: { $ref: '#/components/schemas/Money' }
        spent: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        received:
          $ref: '#/components/schemas/Money'
          description: Income categories only; 0 otherwise
        carryover:
          type: boolean
          description: Rollover overspending into next month

    CategoryBudgetPatch:
      type: object
      minProperties: 1
      properties:
        budgeted: { $ref: '#/components/schemas/Money' }
        carryover: { type: boolean }

    MoneyTransfer:
      type: object
      required: [from, to, amount]
      properties:
        from: { type: string, description: Category id or `to-budget` }
        to: { type: string, description: Category id or `to-budget` }
        amount:
          type: integer
          format: int64
          minimum: 1

    Recurrence:
      type: object
      description: "Actual's RecurConfig: how a schedule repeats"
      required: [frequency, start]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1 }
        start: { $ref: '#/components/schemas/Date' }
        endMode: { type: string, enum: [never, after_n_occurrences, on_date] }
        endOccurrences: { type: integer }
        endDate: { $ref: '#/components/schemas/Date' }
        skipWeekend: { type: boolean }
        weekendSolveMode: { type: string, enum: [before, after] }
        patterns: { type: array, items: {} }

    Schedule:
      type: object
      required: [id, name, nextDate, completed, postsTransaction, payeeId, accountId, amount, amountMax, amountOp, recurrence, date, upcoming]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        nextDate: { type: [string, 'null'] }
        completed: { type: boolean }
        postsTransaction: { type: boolean, description: Actual adds the transaction automatically when due }
        payeeId: { type: [string, 'null'] }
        accountId: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        amountMax: { type: [integer, 'null'], description: Upper bound when amountOp is isbetween }
        amountOp: { type: string, description: "is, isapprox or isbetween" }
        recurrence:
          oneOf:
            - { $ref: '#/components/schemas/Recurrence' }
            - { type: 'null' }
        date: { type: [string, 'null'], description: One-time schedules only }
        upcoming:
          type: array
          items: { type: string }

    ScheduleInput:
      type: object
      minProperties: 1
      properties:
        name: { type: [string, 'null'] }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: string }
        accountId: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        amountMax: { $ref: '#/components/schemas/Money' }
        amountOp: { type: string, enum: [is, isapprox, isbetween] }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        date: { $ref: '#/components/schemas/Date' }
        postsTransaction: { type: boolean }

    RuleItem:
      type: object
      description: "A condition or action in Actual's rule format; value's type depends on field and op"
      required: [op]
      properties:
        field: { type: [string, 'null'] }
        op: { type: string }
        value: {}
        type: { type: [string, 'null'] }
        options: { type: [object, 'null'] }

    Rule:
      type: object
      required: [id, stage, conditionsOp, conditions, actions, scheduleId]
      properties:
        id: { type: string }
        stage: { type: [string, 'null'], description: "pre, post or null (default)" }
        conditionsOp: { type: string, enum: [and, or] }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        scheduleId: { type: [string, 'null'], description: Set for the hidden rule behind a schedule }

    RuleInput:
      type: object
      required: [conditions, actions]
      properties:
        stage: { type: [string, 'null'], enum: [pre, post, null] }
        conditionsOp: { type: string, enum: [and, or] }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }

    PayeeStat:
      type: object
      required: [id, name, transferAccountId, transactionCount, ruleCount]
      properties:
        id: { type: string }
        name: { type: string }
        transferAccountId: { type: [string, 'null'] }
        transactionCount: { type: integer }
        ruleCount: { type: integer }

    Tag:
      type: object
      required: [id, tag, color, description]
      properties:
        id: { type: string }
        tag: { type: string, description: 'Without the leading #' }
        color: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    TagInput:
      type: object
      minProperties: 1
      properties:
        tag: { type: string }
        color: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    CategoryNote:
      type: object
      required: [categoryId, note]
      properties:
        categoryId: { type: string }
        note: { type: [string, 'null'] }

    Job:
      type: object
      required: [id, kind, budgetId, status, startedAt, finishedAt, result, error]
      properties:
        id: { type: string }
        kind: { type: string }
        budgetId: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'] }
        result: { description: "For bank-sync: SyncSummary" }
        error: { type: [string, 'null'] }

    ImportRequest:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName: { type: string, description: The extension picks the parser }
        contentBase64: { type: string, description: File bytes, base64; 10 MB max }
        options:
          type: object
          properties:
            dateFormat: { type: string, enum: [yyyy-MM-dd, MM/dd/yyyy, dd/MM/yyyy, MM/dd/yy, dd/MM/yy] }
            hasHeaderRow: { type: boolean }
            delimiter: { type: string }
            invertAmounts: { type: boolean }
            csvMapping: { $ref: '#/components/schemas/CsvMapping' }

    CsvMapping:
      type: object
      description: Column names for each field; detected from the header when omitted
      properties:
        date: { type: string }
        payee: { type: string }
        amount: { type: string }
        inflow: { type: string }
        outflow: { type: string }
        notes: { type: string }

    ImportRow:
      type: object
      required: [date, amount, payeeName, notes, importedId]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeName: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        importedId: { type: [string, 'null'] }

    ImportPreview:
      type: object
      required: [rows, errors, columns, mapping, newCount, matchedCount]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
        errors: { type: array, items: { type: string } }
        columns: { type: array, items: { type: string }, description: CSV header columns (empty for other formats) }
        mapping:
          oneOf:
            - { $ref: '#/components/schemas/CsvMapping' }
            - { type: 'null' }
        newCount: { type: integer }
        matchedCount: { type: integer, description: Rows that match transactions already in Actual }

    ImportResult:
      type: object
      required: [added, updated, errors]
      properties:
        added: { type: integer }
        updated: { type: integer }
        errors: { type: array, items: { type: string } }

    ReconcileStatus:
      type: object
      required: [clearedBalance, unclearedBalance, balance]
      properties:
        clearedBalance: { $ref: '#/components/schemas/Money' }
        unclearedBalance: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }

    ReconcileResult:
      type: object
      required: [reconciled, difference, adjustmentTransactionId, lockedCount]
      properties:
        reconciled: { type: boolean, description: False when there's a difference and no adjustment was requested }
        difference: { $ref: '#/components/schemas/Money' }
        adjustmentTransactionId: { type: [string, 'null'] }
        lockedCount: { type: integer }

    CashFlowReport:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            type: object
            required: [month, income, expenses, net]
            properties:
              month: { $ref: '#/components/schemas/Month' }
              income: { $ref: '#/components/schemas/Money' }
              expenses: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }

    SpendingReport:
      type: object
      required: [start, end, total, categories]
      properties:
        start: { $ref: '#/components/schemas/Month' }
        end: { $ref: '#/components/schemas/Month' }
        total: { $ref: '#/components/schemas/Money' }
        categories:
          type: array
          items:
            type: object
            required: [categoryId, name, groupId, groupName, amount]
            properties:
              categoryId: { type: [string, 'null'] }
              name: { type: string }
              groupId: { type: [string, 'null'] }
              groupName: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }

    NetWorthReport:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [month, assets, liabilities, netWorth]
            properties:
              month: { $ref: '#/components/schemas/Month' }
              assets: { $ref: '#/components/schemas/Money' }
              liabilities: { $ref: '#/components/schemas/Money' }
              netWorth: { $ref: '#/components/schemas/Money' }
        accounts:
          type: array
          description: Each account's end-of-month balance, aligned with points
          items:
            type: object
            required: [accountId, name, offBudget, closed, balances]
            properties:
              accountId: { type: string }
              name: { type: string }
              offBudget: { type: boolean }
              closed: { type: boolean }
              balances: { type: array, items: { $ref: '#/components/schemas/Money' } }

    TemplatesResult:
      type: object
      required: [month, message]
      properties:
        month: { $ref: '#/components/schemas/BudgetMonth' }
        message: { type: string }

    TemplatesCheck:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
