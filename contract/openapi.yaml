openapi: 3.1.0
info:
  title: Actual Bridge API
  version: 1.0.0
  description: |
    Stable contract between the Android app and the Actual bridge.

    Conventions
    - All money values are integers in minor units (cents). Ledger amounts are signed:
      outflows negative, inflows positive. Budget amounts (`budgeted`, `totalBudgeted`)
      are the amount assigned, positive when money is assigned.
    - Months are `YYYY-MM`, dates are `YYYY-MM-DD`.
    - Within /v1 changes are additive only. Clients must ignore unknown fields and
      treat unknown enum values as `unknown`.
    - Non-idempotent writes require an `Idempotency-Key` header. Creates use a
      client-generated UUID `id` instead.
    - Errors are `application/problem+json` with a stable `code`.
servers:
  - url: https://budget-api.example.com
security:
  - bearer: []
tags:
  - name: system
  - name: auth
  - name: household
  - name: budgets

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Liveness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      responses:
        '200':
          description: What this bridge and the Actual version behind it support
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/setup:
    get:
      tags: [setup]
      operationId: setupStatus
      summary: First-run state. Public; says nothing once the bridge has an owner.
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }

  /v1/setup/claim:
    post:
      tags: [setup]
      operationId: claimBridge
      summary: Become the first owner with the one-time setup code, signing the bridge in to Actual on the way.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupClaim' }
      responses:
        '200':
          description: Owner created and this device signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/auth/pair:
    post:
      tags: [auth]
      operationId: pairDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair (refresh tokens rotate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Revokes the calling device.
      responses:
        '204': { description: Logged out }

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: The calling member and device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/household/members:
    get:
      tags: [household]
      operationId: listMembers
      responses:
        '200':
          description: Household members (owner only)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [household]
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMember' }
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/household/members/{memberId}/pairing-codes:
    post:
      tags: [household]
      operationId: createPairingCode
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '201':
          description: Single-use pairing code, render `pairingUri` as a QR code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/household/members/{memberId}/budgets:
    put:
      tags: [household]
      operationId: setMemberBudgets
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budgetIds]
              properties:
                budgetIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/household/devices/{deviceId}:
    delete:
      tags: [household]
      operationId: revokeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/server:
    get:
      tags: [server]
      operationId: serverStatus
      summary: Versions (bridge, Actual, the newest release with the app's APK), whether one-tap updates are set up, uptime and disk. Newest releases are checked on GitHub every few hours (refresh=true to check now).
      parameters:
        - { name: refresh, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerStatus' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/server/update:
    post:
      tags: [server]
      operationId: updateServer
      summary: Owners. Asks the updater container to pull the newest bridge, Actual and tunnel images and restart them. The bridge restarts too; watch /v1/health for the new version.
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [requested]
                properties:
                  requested: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }

  /v1/server/backups:
    get:
      tags: [server]
      operationId: listBackups
      summary: Owners. Backup schedule and the backups kept (newest first).
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupOverview' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [server]
      operationId: backUpNow
      summary: Owners. Back up every budget (Actual's own export) and the household database now.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/server/backups/settings:
    put:
      tags: [server]
      operationId: backupSettings
      summary: Owners. How often to back up (0 = off) and how many backups to keep.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                intervalHours: { type: integer, enum: [0, 6, 12, 24, 168] }
                keep: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '200':
          description: Backups
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/server/backups/{id}:
    delete:
      tags: [server]
      operationId: deleteBackup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/server/backups/{id}/files/{file}:
    get:
      tags: [server]
      operationId: downloadBackupFile
      summary: Owners. One file from a backup - a budget's .zip (importable in Actual's web app) or household.sqlite.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
          content:
            application/zip:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/server/backups/{id}/restore:
    post:
      tags: [server]
      operationId: restoreBackup
      summary: Owners. Import a budget from a backup as a new budget, "<name> (restored <date>)". Nothing existing is changed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budgetId]
              additionalProperties: false
              properties:
                budgetId: { type: string, minLength: 1 }
      responses:
        '201':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [budgetId, name]
                properties:
                  budgetId: { type: string }
                  name: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/budgets:
    get:
      tags: [budgets]
      operationId: listBudgets
      responses:
        '200':
          description: Budget files the member can open
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Budget' }
    post:
      tags: [budgets]
      operationId: createBudget
      summary: Create an empty budget (owners only), e.g. the first one after setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/bank-sync:
    get:
      tags: [bank-sync]
      operationId: bankSyncOverview
      summary: SimpleFIN connection, request count against its daily quota, and the background schedule.
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncOverview' }

  /v1/bank-sync/simplefin:
    put:
      tags: [bank-sync]
      operationId: connectSimpleFin
      summary: Owners. Stores a SimpleFIN setup token and claims it right away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupToken]
              additionalProperties: false
              properties:
                setupToken: { type: string, minLength: 10, maxLength: 4096 }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncOverview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [bank-sync]
      operationId: resetSimpleFin
      summary: Owners. Forgets the SimpleFIN credentials (linked accounts stop syncing).
      responses:
        '204': { description: Reset }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/bank-sync/schedule:
    put:
      tags: [bank-sync]
      operationId: setBankSyncSchedule
      summary: Owners. How often the bridge syncs every linked account in the background (0 = off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intervalHours]
              additionalProperties: false
              properties:
                intervalHours: { type: integer, enum: [0, 2, 4, 6, 12, 24] }
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/bank-sync/backfill:
    delete:
      tags: [bank-sync]
      operationId: cancelBackfill
      summary: Owners. Stop the history import in progress; what was imported stays.
      responses:
        '200':
          description: The import's final state (null when there was none)
          content:
            application/json:
              schema:
                type: object
                required: [backfill]
                properties:
                  backfill:
                    oneOf:
                      - type: 'null'
                      - $ref: '#/components/schemas/BackfillState'
        '403': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/bank-sync/simplefin/backfill:
    post:
      tags: [bank-sync]
      operationId: startBackfill
      summary: Owners. Import older SimpleFIN history (up to 10 years) in 90-day windows, within SimpleFIN's daily limit. Runs in the background over hours or days; watch it in GET /v1/bank-sync.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [years]
              additionalProperties: false
              properties:
                years: { type: integer, minimum: 1, maximum: 10 }
                accountIds: { type: array, items: { type: string, minLength: 1 }, maxItems: 100, description: Linked SimpleFIN accounts; omit for all }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackfillState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/bank-sync/simplefin/accounts:
    get:
      tags: [bank-sync]
      operationId: listSimpleFinAccounts
      summary: Accounts in the SimpleFIN connection, and which account in this budget each is linked to. Costs one SimpleFIN request.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: refresh, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalAccount' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/bank-sync/simplefin/link:
    post:
      tags: [bank-sync]
      operationId: linkSimpleFinAccount
      summary: Link a SimpleFIN account to an existing account (accountId) or a new one; imports recent transactions.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId]
              additionalProperties: false
              properties:
                externalId: { type: string, minLength: 1 }
                accountId: { type: string, description: Existing account to link; omit to create one }
                offBudget: { type: boolean }
                startDate: { $ref: '#/components/schemas/Date' }
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                type: object
                required: [accountId]
                properties:
                  accountId: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/unlink:
    post:
      tags: [bank-sync]
      operationId: unlinkAccount
      summary: Stop bank sync for an account. Its transactions stay.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Unlinked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/bank-sync-settings:
    get:
      tags: [bank-sync]
      operationId: getBankSyncSettings
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncSettings' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [bank-sync]
      operationId: updateBankSyncSettings
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                importTransactions: { type: boolean }
                importPending: { type: boolean }
                importNotes: { type: boolean }
                reimportDeleted: { type: boolean }
                updateDates: { type: boolean }
                mapping: { $ref: '#/components/schemas/SyncMappings' }
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankSyncSettings' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts:
    get:
      tags: [budgets]
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Accounts with current balances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                offBudget: { type: boolean, default: false }
                initialBalance: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/transactions/batch:
    post:
      tags: [budgets]
      operationId: batchTransactions
      summary: Members. One change to many transactions (multi-select), or deleting them. Rows that can't take the change are skipped and listed.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                set:
                  type: object
                  description: Fields to set on every transaction. Send either set or delete.
                  properties:
                    categoryId: { type: [string, 'null'] }
                    accountId: { type: string }
                    cleared: { type: boolean }
                    notes: { type: [string, 'null'] }
                    date: { $ref: '#/components/schemas/Date' }
                    payeeId: { type: [string, 'null'] }
                delete: { type: boolean }
      responses:
        '200':
          description: What changed
          content:
            application/json:
              schema:
                type: object
                required: [updated, deleted, skipped]
                properties:
                  updated: { type: integer }
                  deleted: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id: { type: string }
                        reason: { type: string, enum: [not_found, split, split_part, transfer] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/review:
    get:
      tags: [budgets]
      operationId: getReviewInbox
      summary: "This person's review inbox: transactions added since they last caught up, plus anything uncategorized, minus what they've reviewed. Each person has their own; your own entries and edits count as reviewed."
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewInbox' }
    post:
      tags: [budgets]
      operationId: markReviewed
      summary: Mark transactions reviewed, or everything (`all`, which also moves the watermark to now).
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: string } }
                all: { type: boolean, const: true }
      responses:
        '200':
          description: How many are left
          content:
            application/json:
              schema: { type: object, required: [remaining], properties: { remaining: { type: integer } } }

  /v1/budgets/{budgetId}/category-groups:
    get:
      tags: [budgets]
      operationId: listCategoryGroups
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Category groups with their categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryGroup' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createCategoryGroup
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryGroup' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/payees:
    get:
      tags: [budgets]
      operationId: listPayees
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Payees (Monarch "merchants")
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Payee' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/transactions:
    get:
      tags: [budgets]
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: accountId, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: payeeId, in: query, schema: { type: string } }
        - { name: groupId, in: query, description: Transactions in any category of this group, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Search payee, notes and category name, schema: { type: string, maxLength: 100 } }
        - { name: uncategorized, in: query, description: Only on-budget transactions that still need a category, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Newest first, splits grouped under their parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createTransaction
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTransaction' }
      responses:
        '201':
          description: Created. Re-sending the same `id` returns the existing transaction with 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '200':
          description: Already existed (idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - { name: transactionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [budgets]
      operationId: getTransaction
      responses:
        '200':
          description: The transaction, with splits grouped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [budgets]
      operationId: updateTransaction
      description: |
        Partial update. Changing the payee to a transfer payee turns it into a transfer.
        `subtransactions` replaces all splits (capability `transactions.splits`); send an
        existing split's `id` to keep it, omit ids for new splits, `[]` to unsplit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200':
          description: The updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteTransaction
      description: Also removes a transfer's other side and a split's children.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/preferences:
    get:
      tags: [budgets]
      operationId: getPreferences
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget-wide display preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}:
    patch:
      tags: [budgets]
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/close:
    post:
      tags: [budgets]
      operationId: closeAccount
