openapi: 3.1.0
info:
  title: Actual Bridge API
  version: 1.0.0
  description: |
    Stable contract between the Android app and the Actual bridge.

    Conventions
    - All money values are integers in minor units (cents). Ledger amounts are signed:
      outflows negative, inflows positive. Budget amounts (`budgeted`, `totalBudgeted`)
      are the amount assigned, positive when money is assigned.
    - Months are `YYYY-MM`, dates are `YYYY-MM-DD`.
    - Within /v1 changes are additive only. Clients must ignore unknown fields and
      treat unknown enum values as `unknown`.
    - Non-idempotent writes require an `Idempotency-Key` header. Creates use a
      client-generated UUID `id` instead.
    - Errors are `application/problem+json` with a stable `code`.
servers:
  - url: https://budget-api.example.com
security:
  - bearer: []
tags:
  - name: system
  - name: auth
  - name: household
  - name: budgets

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Liveness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /v1/capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      responses:
        '200':
          description: What this bridge and the Actual version behind it support
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/pair:
    post:
      tags: [auth]
      operationId: pairDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
      responses:
        '200':
          description: Device paired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair (refresh tokens rotate)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Revokes the calling device.
      responses:
        '204': { description: Logged out }

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: The calling member and device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/household/members:
    get:
      tags: [household]
      operationId: listMembers
      responses:
        '200':
          description: Household members (owner only)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [household]
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMember' }
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/household/members/{memberId}/pairing-codes:
    post:
      tags: [household]
      operationId: createPairingCode
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '201':
          description: Single-use pairing code, render `pairingUri` as a QR code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/household/members/{memberId}/budgets:
    put:
      tags: [household]
      operationId: setMemberBudgets
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budgetIds]
              properties:
                budgetIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/household/devices/{deviceId}:
    delete:
      tags: [household]
      operationId: revokeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/budgets:
    get:
      tags: [budgets]
      operationId: listBudgets
      responses:
        '200':
          description: Budget files the member can open
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Budget' }

  /v1/budgets/{budgetId}/accounts:
    get:
      tags: [budgets]
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Accounts with current balances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                offBudget: { type: boolean, default: false }
                initialBalance: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Created account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/category-groups:
    get:
      tags: [budgets]
      operationId: listCategoryGroups
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Category groups with their categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryGroup' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createCategoryGroup
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryGroup' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/payees:
    get:
      tags: [budgets]
      operationId: listPayees
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Payees (Monarch "merchants")
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Payee' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/transactions:
    get:
      tags: [budgets]
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: accountId, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, description: Search payee, notes and category name, schema: { type: string, maxLength: 100 } }
        - { name: uncategorized, in: query, description: Only on-budget transactions that still need a category, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Newest first, splits grouped under their parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createTransaction
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTransaction' }
      responses:
        '201':
          description: Created. Re-sending the same `id` returns the existing transaction with 200.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '200':
          description: Already existed (idempotent replay)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - { name: transactionId, in: path, required: true, schema: { type: string } }
    get:
      tags: [budgets]
      operationId: getTransaction
      responses:
        '200':
          description: The transaction, with splits grouped
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [budgets]
      operationId: updateTransaction
      description: |
        Partial update. Changing the payee to a transfer payee turns it into a transfer.
        `subtransactions` replaces all splits (capability `transactions.splits`); send an
        existing split's `id` to keep it, omit ids for new splits, `[]` to unsplit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200':
          description: The updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteTransaction
      description: Also removes a transfer's other side and a split's children.
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/preferences:
    get:
      tags: [budgets]
      operationId: getPreferences
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Budget-wide display preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}:
    patch:
      tags: [budgets]
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/close:
    post:
      tags: [budgets]
      operationId: closeAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transferAccountId: { type: string, description: Required when the balance isn't zero }
                transferCategoryId: { type: string, description: Category for the balance when moving it off budget }
      responses:
        '200':
          description: The closed account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '204': { description: Actual deleted the account because it had no transactions }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/reopen:
    post:
      tags: [budgets]
      operationId: reopenAccount
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The reopened account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/categories:
    post:
      tags: [budgets]
      operationId: createCategory
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, groupId]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                groupId: { type: string }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [budgets]
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                hidden: { type: boolean }
                groupId: { type: string }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteCategory
      parameters:
        - { name: transferCategoryId, in: query, description: Where existing transactions and budget amounts move, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/category-groups/{id}:
    parameters:
      - $ref: '#/components/parameters/BudgetId'
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [budgets]
      operationId: updateCategoryGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                hidden: { type: boolean }
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryGroup' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteCategoryGroup
      parameters:
        - { name: transferCategoryId, in: query, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months:
    get:
      tags: [budgets]
      operationId: listMonths
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Months that have budget data
          content:
            application/json:
              schema:
                type: object
                required: [months]
                properties:
                  months:
                    type: array
                    items: { $ref: '#/components/schemas/Month' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}:
    get:
      tags: [budgets]
      operationId: getBudgetMonth
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Envelope budget for the month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/categories/{categoryId}:
    patch:
      tags: [budgets]
      operationId: updateCategoryBudget
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
        - { name: categoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryBudgetPatch' }
      responses:
        '200':
          description: The updated month (budget math is always recomputed by Actual)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/transfers:
    post:
      tags: [budgets]
      operationId: moveMoney
      description: Move money between categories or to/from "To Budget". Capability `budget.moveMoney`.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoneyTransfer' }
      responses:
        '200':
          description: The updated month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/hold:
    put:
      tags: [budgets]
      operationId: holdForNextMonth
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: The updated month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: resetHold
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: The updated month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/schedules:
    get:
      tags: [budgets]
      operationId: listSchedules
      description: Scheduled and recurring transactions (Monarch "Recurring").
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: upcoming, in: query, description: How many upcoming dates to include, schema: { type: integer, minimum: 1, maximum: 24, default: 3 } }
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Schedule' } } } }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createSchedule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/schedules/{id}:
    patch:
      tags: [budgets]
      operationId: updateSchedule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteSchedule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/schedules/{id}/skip:
    post:
      tags: [budgets]
      operationId: skipSchedule
      description: Skip the next occurrence. Capability `schedules.skip`.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/schedules/{id}/post:
    post:
      tags: [budgets]
      operationId: postSchedule
      description: Add the next occurrence as a transaction now. Capability `schedules.post`.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '404': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/rules:
    get:
      tags: [budgets]
      operationId: listRules
      description: All rules, including the hidden ones behind schedules (scheduleId set).
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Rule' } } } }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createRule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/rules/{id}:
    put:
      tags: [budgets]
      operationId: updateRule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteRule
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/payees/stats:
    get:
      tags: [budgets]
      operationId: listPayeeStats
      description: Payees with usage counts (Monarch "Merchants").
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Payees
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/PayeeStat' } } } }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/payees/{id}:
    patch:
      tags: [budgets]
      operationId: renamePayee
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 200 } } }
      responses:
        '200':
          description: Renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payee' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deletePayee
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/payees/{id}/merge:
    post:
      tags: [budgets]
      operationId: mergePayees
      description: Moves transactions and rules from mergeIds onto this payee, then removes them.
