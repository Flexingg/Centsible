          content:
            application/json:
              schema: { $ref: '#/components/schemas/Insights' }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/subscriptions:
    get:
      tags: [insights]
