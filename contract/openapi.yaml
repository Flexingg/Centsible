          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetMonth' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/autopilot:
    get:
      tags: [plan]
      operationId: getAutopilot
      summary: Suggested budgets from past spending (3, 6 and 12-month averages), overspent categories, and a plan to cover them.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autopilot' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [plan]
      operationId: applyAutopilot
      summary: Budget the suggested amounts (default every category whose suggestion differs).
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basis]
              additionalProperties: false
              properties:
                basis: { type: integer, enum: [3, 6, 12] }
                categoryIds: { type: array, items: { type: string, minLength: 1 }, maxItems: 500 }
      responses:
        '200':
          description: The updated month
          content:
            application/json:
              schema:
                type: object
                required: [month, changed]
                properties:
                  month: { $ref: '#/components/schemas/BudgetMonth' }
                  changed: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/cover-overspending:
    post:
      tags: [plan]
      operationId: coverOverspending
      summary: Cover every overspent category, from To Budget first and then the categories with the most left.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      responses:
        '200':
          description: What moved
          content:
            application/json:
              schema:
                type: object
                required: [month, moves, uncovered]
                properties:
                  month: { $ref: '#/components/schemas/BudgetMonth' }
                  moves: { type: array, items: { $ref: '#/components/schemas/CoverMove' } }
                  uncovered: { $ref: '#/components/schemas/Money' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/goals:
    get:
      tags: [plan]
      operationId: listGoals
      summary: Savings goals (categories with a "#goal" or "#template ... by" line in their notes) and how they're going.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: month, in: query, schema: { $ref: '#/components/schemas/Month' } }
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: object
                required: [month, items]
                properties:
                  month: { $ref: '#/components/schemas/Month' }
                  items: { type: array, items: { $ref: '#/components/schemas/Goal' } }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/categories/{id}/goal:
    put:
      tags: [plan]
      operationId: setGoal
      summary: Set a category's savings goal. It's written to the category notes as Actual's own template line; other lines stay.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
