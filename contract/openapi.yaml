            schema: { type: object, required: [mergeIds], properties: { mergeIds: { type: array, minItems: 1, items: { type: string } } } }
      responses:
        '204': { description: Merged }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/tags:
    get:
      tags: [budgets]
      operationId: listTags
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Tag' } } } }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: createTag
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '409': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/tags/{id}:
    patch:
      tags: [budgets]
      operationId: updateTag
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [budgets]
      operationId: deleteTag
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/categories/{id}/note:
    get:
      tags: [budgets]
      operationId: getCategoryNote
      description: 'Category notes hold #template goal lines.'
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryNote' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    put:
      tags: [budgets]
      operationId: setCategoryNote
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: [string, 'null'] } } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryNote' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/bank-sync:
    post:
      tags: [budgets]
      operationId: syncAccount
      description: Starts a bank sync for a linked account. Poll the job.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Job started (or the one already running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/bank-sync:
    post:
      tags: [budgets]
      operationId: syncAllAccounts
      description: Starts a bank sync for every linked account.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '202':
          description: Job started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/jobs/{jobId}:
    get:
      tags: [system]
      operationId: getJob
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/import/preview:
    post:
      tags: [budgets]
      operationId: previewImport
      description: Parses a statement (OFX, QFX, QIF, CSV, CAMT) and reports what importing it would do.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/import:
    post:
      tags: [budgets]
      operationId: importFile
      description: Imports the statement. Matching transactions are merged, not duplicated.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/accounts/{id}/reconcile:
    get:
      tags: [budgets]
      operationId: getReconcileStatus
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileStatus' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
    post:
      tags: [budgets]
      operationId: reconcileAccount
      description: Compares the cleared balance with a statement; optionally adds an adjustment; then locks cleared transactions.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [statementBalance], properties: { statementBalance: { $ref: '#/components/schemas/Money' }, createAdjustment: { type: boolean, default: false } } }
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/reports/cash-flow:
    get:
      tags: [budgets]
      operationId: cashFlowReport
      description: Income and expenses per month (on budget, excluding transfers and starting balances).
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: start, in: query, required: true, schema: { $ref: '#/components/schemas/Month' } }
        - { name: end, in: query, required: true, schema: { $ref: '#/components/schemas/Month' } }
      responses:
        '200':
          description: Cash flow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashFlowReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/reports/spending:
    get:
      tags: [budgets]
      operationId: spendingReport
      description: Spending by category for a month range.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: start, in: query, required: true, schema: { $ref: '#/components/schemas/Month' } }
        - { name: end, in: query, required: true, schema: { $ref: '#/components/schemas/Month' } }
      responses:
        '200':
          description: Spending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendingReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/reports/net-worth:
    get:
      tags: [budgets]
      operationId: netWorthReport
      description: End-of-month balances across all accounts.
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 120, default: 12 } }
      responses:
        '200':
          description: Net worth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetWorthReport' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/months/{month}/apply-templates:
    post:
      tags: [budgets]
      operationId: applyTemplates
      description: 'Fills budgets from #template notes. Capability `budget.templates`.'
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/MonthParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: [object, 'null'], properties: { overwrite: { type: boolean, default: false } } }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatesResult' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

  /v1/budgets/{budgetId}/templates/check:
    get:
      tags: [budgets]
      operationId: checkTemplates
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatesCheck' }
        '501': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    BudgetId:
      name: budgetId
      in: path
      required: true
      description: Actual sync id (the budget's `groupId`), stable across devices
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    MonthParam:
      name: month
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Month' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: integer
      format: int64
      description: Minor units (cents)
    Month:
      type: string
      pattern: '^\d{4}-\d{2}$'
    Date:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Role:
      type: string
      enum: [owner, member, viewer]

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code, e.g. `unauthorized`, `forbidden`, `not_found`, `validation`, `feature_unavailable`, `actual_unavailable`, `budget_encrypted`, `conflict`, `rate_limited`
        detail: { type: string }

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }

    Capabilities:
      type: object
      required: [contract, bridge, actual, status, features]
      properties:
        contract: { type: string, description: Contract version implemented by the bridge }
        bridge:
          type: object
          required: [version]
          properties:
            version: { type: string }
        actual:
          type: object
          required: [apiVersion, compatibility]
          properties:
            serverVersion: { type: [string, 'null'] }
            apiVersion: { type: string }
            compatibility:
              type: string
              enum: [ok, api_newer, api_older, unknown]
        status:
          type: string
          enum: [ok, degraded, unavailable]
        features:
          type: object
          description: Feature flag map. Absent means false.
          additionalProperties: { type: boolean }

    PairRequest:
      type: object
      required: [code, deviceName, platform]
      properties:
        code: { type: string, minLength: 6 }
        deviceName: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [android, ios, web, other] }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, member, device]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access token lifetime in seconds }
        member: { $ref: '#/components/schemas/Member' }
        device: { $ref: '#/components/schemas/Device' }

    Member:
      type: object
      required: [id, displayName, role, disabled, budgetIds]
      properties:
        id: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        budgetIds:
          type: array
          description: Budgets this member may open. Owners implicitly have all.
          items: { type: string }

    NewMember:
      type: object
      required: [displayName, role]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        role: { $ref: '#/components/schemas/Role' }
        budgetIds:
          type: array
          items: { type: string }

    Device:
      type: object
      required: [id, name, platform, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time }

    Me:
      type: object
      required: [member, device, devices]
      properties:
        member: { $ref: '#/components/schemas/Member' }
        device: { $ref: '#/components/schemas/Device' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }

    PairingCode:
      type: object
      required: [code, expiresAt, pairingUri]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        pairingUri:
          type: string
          description: |
            `actualbridge://pair?u=<bridge url>&c=<code>[&cfid=<CF Access client id>&cfsecret=<secret>]`
            Encode as a QR code.

    Budget:
      type: object
      required: [id, name, encrypted]
      properties:
        id: { type: string, description: Actual sync id (groupId) }
        name: { type: string }
        encrypted: { type: boolean }

    Account:
      type: object
      required: [id, name, offBudget, closed, balance]
      properties:
        id: { type: string }
        name: { type: string }
        offBudget: { type: boolean }
        closed: { type: boolean }
        balance: { $ref: '#/components/schemas/Money' }
        accountGroupId: { type: [string, 'null'] }
        syncSource: { type: [string, 'null'], description: "Bank sync provider once linked in Actual (goCardless, simpleFin, pluggyai)" }
        lastSync: { type: [string, 'null'], format: date-time }

    Category:
      type: object
      required: [id, name, groupId, isIncome, hidden]
      properties:
        id: { type: string }
        name: { type: string }
        groupId: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }

    CategoryGroup:
      type: object
      required: [id, name, isIncome, hidden, categories]
      properties:
        id: { type: string }
        name: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    Payee:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        transferAccountId:
          type: [string, 'null']
          description: Set when this payee represents a transfer to that account

    Transaction:
      type: object
      required: [id, accountId, date, amount, cleared, reconciled, isParent, subtransactions]
      properties:
        id: { type: string }
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: [string, 'null'] }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cleared: { type: boolean }
        reconciled: { type: boolean }
        transferId: { type: [string, 'null'] }
        isParent: { type: boolean }
        parentId: { type: [string, 'null'] }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }

    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        nextCursor: { type: [string, 'null'] }

    NewTransaction:
      type: object
      required: [id, accountId, date, amount]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated. Makes the create idempotent for outbox replays.
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: string }
        payeeName: { type: string, description: Used when payeeId is absent; creates the payee if needed }
        categoryId: { type: string }
        notes: { type: string }
        cleared: { type: boolean }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/SplitInput' }

    SplitInput:
      type: object
      required: [amount]
      properties:
        id: { type: string, description: An existing split's id (PATCH only) }
        amount: { $ref: '#/components/schemas/Money' }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }

    TransactionPatch:
      type: object
      minProperties: 1
      properties:
        accountId: { type: string }
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: string, description: Used when payeeId is absent; creates the payee if needed }
        categoryId: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cleared: { type: boolean }
        subtransactions:
          type: array
          items: { $ref: '#/components/schemas/SplitInput' }

    Preferences:
      type: object
      required: [budgetType, currencyCode, numberFormat, dateFormat, firstDayOfWeek, hideFraction]
      properties:
        budgetType: { type: string, enum: [envelope, tracking, unknown] }
        currencyCode: { type: string, description: ISO 4217, default USD }
        numberFormat: { type: string, description: "Actual's number format id, e.g. comma-dot" }
        dateFormat: { type: string }
        firstDayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0 = Sunday }
        hideFraction: { type: boolean }

    BudgetMonth:
      type: object
      required: [month, budgetType, toBudget, incomeAvailable, lastMonthOverspent, forNextMonth,
                 fromLastMonth, totalBudgeted, totalIncome, totalSpent, totalBalance, groups]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        budgetType:
          type: string
          enum: [envelope, tracking, unknown]
        toBudget: { $ref: '#/components/schemas/Money' }
        incomeAvailable: { $ref: '#/components/schemas/Money' }
        lastMonthOverspent: { $ref: '#/components/schemas/Money' }
        forNextMonth: { $ref: '#/components/schemas/Money' }
        fromLastMonth: { $ref: '#/components/schemas/Money' }
        totalBudgeted: { $ref: '#/components/schemas/Money' }
        totalIncome: { $ref: '#/components/schemas/Money' }
        totalSpent: { $ref: '#/components/schemas/Money' }
        totalBalance: { $ref: '#/components/schemas/Money' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/BudgetGroup' }

    BudgetGroup:
      type: object
      required: [id, name, isIncome, hidden, budgeted, spent, balance, received, categories]
      properties:
        id: { type: string }
        name: { type: string }
        isIncome: { type: boolean }
        hidden: { type: boolean }
        budgeted: { $ref: '#/components/schemas/Money' }
        spent: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        received: { $ref: '#/components/schemas/Money' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/BudgetCategory' }

    BudgetCategory:
      type: object
      required: [id, name, hidden, budgeted, spent, balance, received, carryover]
      properties:
        id: { type: string }
        name: { type: string }
        hidden: { type: boolean }
        budgeted: { $ref: '#/components/schemas/Money' }
        spent: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        received:
          $ref: '#/components/schemas/Money'
          description: Income categories only; 0 otherwise
        carryover:
          type: boolean
          description: Rollover overspending into next month

    CategoryBudgetPatch:
      type: object
      minProperties: 1
      properties:
        budgeted: { $ref: '#/components/schemas/Money' }
        carryover: { type: boolean }

    MoneyTransfer:
      type: object
      required: [from, to, amount]
      properties:
        from: { type: string, description: Category id or `to-budget` }
        to: { type: string, description: Category id or `to-budget` }
        amount:
          type: integer
          format: int64
          minimum: 1

    Recurrence:
      type: object
      description: "Actual's RecurConfig: how a schedule repeats"
      required: [frequency, start]
      properties:
        frequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        interval: { type: integer, minimum: 1 }
        start: { $ref: '#/components/schemas/Date' }
        endMode: { type: string, enum: [never, after_n_occurrences, on_date] }
        endOccurrences: { type: integer }
        endDate: { $ref: '#/components/schemas/Date' }
        skipWeekend: { type: boolean }
        weekendSolveMode: { type: string, enum: [before, after] }
        patterns: { type: array, items: {} }

    Schedule:
      type: object
      required: [id, name, nextDate, completed, postsTransaction, payeeId, accountId, amount, amountMax, amountOp, recurrence, date, upcoming]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        nextDate: { type: [string, 'null'] }
        completed: { type: boolean }
        postsTransaction: { type: boolean, description: Actual adds the transaction automatically when due }
        payeeId: { type: [string, 'null'] }
        accountId: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        amountMax: { type: [integer, 'null'], description: Upper bound when amountOp is isbetween }
        amountOp: { type: string, description: "is, isapprox or isbetween" }
        recurrence:
          oneOf:
            - { $ref: '#/components/schemas/Recurrence' }
            - { type: 'null' }
        date: { type: [string, 'null'], description: One-time schedules only }
        upcoming:
          type: array
          items: { type: string }

    ScheduleInput:
      type: object
      minProperties: 1
      properties:
        name: { type: [string, 'null'] }
        payeeId: { type: [string, 'null'] }
        payeeName: { type: string }
        accountId: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        amountMax: { $ref: '#/components/schemas/Money' }
        amountOp: { type: string, enum: [is, isapprox, isbetween] }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        date: { $ref: '#/components/schemas/Date' }
        postsTransaction: { type: boolean }

    RuleItem:
      type: object
      description: "A condition or action in Actual's rule format; value's type depends on field and op"
      required: [op]
      properties:
        field: { type: [string, 'null'] }
        op: { type: string }
        value: {}
        type: { type: [string, 'null'] }
        options: { type: [object, 'null'] }

    Rule:
      type: object
      required: [id, stage, conditionsOp, conditions, actions, scheduleId]
      properties:
        id: { type: string }
        stage: { type: [string, 'null'], description: "pre, post or null (default)" }
        conditionsOp: { type: string, enum: [and, or] }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        scheduleId: { type: [string, 'null'], description: Set for the hidden rule behind a schedule }

    RuleInput:
      type: object
      required: [conditions, actions]
      properties:
        stage: { type: [string, 'null'], enum: [pre, post, null] }
        conditionsOp: { type: string, enum: [and, or] }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleItem' } }

    PayeeStat:
      type: object
      required: [id, name, transferAccountId, transactionCount, ruleCount]
      properties:
        id: { type: string }
        name: { type: string }
        transferAccountId: { type: [string, 'null'] }
        transactionCount: { type: integer }
        ruleCount: { type: integer }

    Tag:
      type: object
      required: [id, tag, color, description]
      properties:
        id: { type: string }
        tag: { type: string, description: 'Without the leading #' }
        color: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    TagInput:
      type: object
      minProperties: 1
      properties:
        tag: { type: string }
        color: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    CategoryNote:
      type: object
      required: [categoryId, note]
      properties:
        categoryId: { type: string }
        note: { type: [string, 'null'] }

    Job:
      type: object
      required: [id, kind, budgetId, status, startedAt, finishedAt, result, error]
      properties:
        id: { type: string }
        kind: { type: string }
        budgetId: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'] }
        result: { description: "For bank-sync: { accounts, newTransactions }" }
        error: { type: [string, 'null'] }

    ImportRequest:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName: { type: string, description: The extension picks the parser }
        contentBase64: { type: string, description: File bytes, base64; 10 MB max }
        options:
          type: object
          properties:
            dateFormat: { type: string, enum: [yyyy-MM-dd, MM/dd/yyyy, dd/MM/yyyy, MM/dd/yy, dd/MM/yy] }
            hasHeaderRow: { type: boolean }
            delimiter: { type: string }
            invertAmounts: { type: boolean }
            csvMapping: { $ref: '#/components/schemas/CsvMapping' }

    CsvMapping:
      type: object
      description: Column names for each field; detected from the header when omitted
      properties:
        date: { type: string }
        payee: { type: string }
        amount: { type: string }
        inflow: { type: string }
        outflow: { type: string }
        notes: { type: string }

    ImportRow:
      type: object
      required: [date, amount, payeeName, notes, importedId]
      properties:
        date: { $ref: '#/components/schemas/Date' }
        amount: { $ref: '#/components/schemas/Money' }
        payeeName: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        importedId: { type: [string, 'null'] }

    ImportPreview:
      type: object
      required: [rows, errors, columns, mapping, newCount, matchedCount]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
        errors: { type: array, items: { type: string } }
        columns: { type: array, items: { type: string }, description: CSV header columns (empty for other formats) }
        mapping:
          oneOf:
            - { $ref: '#/components/schemas/CsvMapping' }
            - { type: 'null' }
        newCount: { type: integer }
        matchedCount: { type: integer, description: Rows that match transactions already in Actual }

    ImportResult:
      type: object
      required: [added, updated, errors]
      properties:
        added: { type: integer }
        updated: { type: integer }
        errors: { type: array, items: { type: string } }

    ReconcileStatus:
      type: object
      required: [clearedBalance, unclearedBalance, balance]
      properties:
        clearedBalance: { $ref: '#/components/schemas/Money' }
        unclearedBalance: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }

    ReconcileResult:
      type: object
      required: [reconciled, difference, adjustmentTransactionId, lockedCount]
      properties:
        reconciled: { type: boolean, description: False when there's a difference and no adjustment was requested }
        difference: { $ref: '#/components/schemas/Money' }
        adjustmentTransactionId: { type: [string, 'null'] }
        lockedCount: { type: integer }

    CashFlowReport:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items:
            type: object
            required: [month, income, expenses, net]
            properties:
              month: { $ref: '#/components/schemas/Month' }
              income: { $ref: '#/components/schemas/Money' }
              expenses: { $ref: '#/components/schemas/Money' }
              net: { $ref: '#/components/schemas/Money' }

    SpendingReport:
      type: object
      required: [start, end, total, categories]
      properties:
        start: { $ref: '#/components/schemas/Month' }
        end: { $ref: '#/components/schemas/Month' }
        total: { $ref: '#/components/schemas/Money' }
        categories:
          type: array
          items:
            type: object
            required: [categoryId, name, groupId, groupName, amount]
            properties:
              categoryId: { type: [string, 'null'] }
              name: { type: string }
              groupId: { type: [string, 'null'] }
              groupName: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }

    NetWorthReport:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [month, assets, liabilities, netWorth]
            properties:
              month: { $ref: '#/components/schemas/Month' }
              assets: { $ref: '#/components/schemas/Money' }
              liabilities: { $ref: '#/components/schemas/Money' }
              netWorth: { $ref: '#/components/schemas/Money' }

    TemplatesResult:
      type: object
      required: [month, message]
      properties:
        month: { $ref: '#/components/schemas/BudgetMonth' }
        message: { type: string }

    TemplatesCheck:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
